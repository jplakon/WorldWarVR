name: Windows x86 CI

on:
  # Manual until the hosted image is verified against the pinned local
  # CMake 3.31.6-msvc6 toolchain. Publication is not a hosted-CI acceptance.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x86-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build and test Win32 runtime
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP "wawvr-$($env:BUILD_CONFIGURATION.ToLowerInvariant())"
          $tempRoot = Join-Path $env:RUNNER_TEMP "wawvr-temp-$($env:BUILD_CONFIGURATION.ToLowerInvariant())"
          & .\scripts\build.ps1 `
            -Configuration $env:BUILD_CONFIGURATION `
            -BuildRoot $buildRoot `
            -TempRoot $tempRoot
